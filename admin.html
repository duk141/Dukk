
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL - SYSTEM CONTROL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 12px;
        }
        .admin-table th, .admin-table td {
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 8px;
            text-align: center;
        }
        .admin-table th {
            background: rgba(0, 243, 255, 0.2);
            color: #00f3ff;
        }
        .btn-action-small {
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            border: 1px solid #00ff66;
            background: rgba(0, 255, 102, 0.2);
            color: #00ff66;
            cursor: pointer;
        }
        .btn-action-small:hover {
            background: #00ff66;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="neon-box-wrapper" style="max-width: 800px;">
        <div class="neon-container">
            <h2>⚙️ HỆ THỐNG QUẢN TRỊ ADMIN</h2>

            <!-- Đăng nhập Admin -->
            <div id="admin-login-box">
                <div class="form-group">
                    <label>Mật Khẩu Admin System:</label>
                    <input type="password" id="admin-pass" placeholder="Nhập mật khẩu Admin (mặc định: 123456)">
                </div>
                <button class="btn-primary" onclick="loginAdmin()">Truy Cập Quản Trị</button>
            </div>

            <!-- Bảng Điều Khiển Admin -->
            <div id="admin-dashboard" class="hidden">
                <div style="display:flex; justify-between; align-items:center; margin-bottom:15px;">
                    <h3 style="color:#00ff66; font-size:14px;">DANH SÁCH NGƯỜI DÙNG & CẤP KEY</h3>
                    <button class="btn-logout" onclick="logoutAdmin()">Đăng xuất Admin</button>
                </div>

                <!-- Cấp Key Nhanh -->
                <div style="background:rgba(255,255,255,0.03); padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid rgba(0,243,255,0.2);">
                    <h4 style="color:#00f3ff; font-size:12px; margin-bottom:8px;">Cấp Key VIP Thủ Công:</h4>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="target-user" placeholder="Tên tài khoản người dùng" style="flex:1;">
                        <select id="key-days" style="padding:8px; background:#05050f; color:#fff; border:1px solid #00f3ff; border-radius:6px;">
                            <option value="1">1 Ngày</option>
                            <option value="7">7 Ngày</option>
                            <option value="30">30 Ngày</option>
                            <option value="3650">Vĩnh Viễn</option>
                        </select>
                        <button class="btn-action-small" onclick="grantKeyManual()" style="padding:8px 12px; font-size:12px;">Cấp Key</button>
                    </div>
                </div>

                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Tên User</th>
                            <th>Hạn Key VIP</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body">
                        <!-- Render danh sách qua JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value.trim();
            if (pass === '123456') {
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadUsersTable();
            } else {
                alert('Mật khẩu Admin không đúng!');
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-login-box').classList.remove('hidden');
            document.getElementById('admin-pass').value = '';
        }

        function loadUsersTable() {
            const users = JSON.parse(localStorage.getItem('registered_users')) || {};
            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = '';

            Object.keys(users).forEach(username => {
                let keyDataRaw = localStorage.getItem(`user_key_${username}`);
                let expiry = 'Chưa kích hoạt';
                if (keyDataRaw) {
                    let keyData = JSON.parse(keyDataRaw);
                    expiry = keyData.expiry;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:#00f3ff; font-weight:bold;">${username}</td>
                    <td style="color:#00ff66;">${expiry}</td>
                    <td>
                        <button class="btn-action-small" onclick="quickGrant('${username}', 30)">Cấp 30 Ngày</button>
                        <button class="btn-action-small" style="border-color:#ff0055; color:#ff0055; background:rgba(255,0,85,0.1);" onclick="revokeKey('${username}')">Xóa Key</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function grantKeyManual() {
            const user = document.getElementById('target-user').value.trim();
            const days = parseInt(document.getElementById('key-days').value);
            if (!user) { alert('Vui lòng nhập tên tài khoản!'); return; }
            quickGrant(user, days);
        }

        function quickGrant(username, days) {
            let expiryDate = new Date();
            expiryDate.setDate(expiryDate.getDate() + days);
            let expiryStr = days >= 3650 ? 'Vĩnh Viễn' : expiryDate.toLocaleString('vi-VN');

            let keyData = { key: "ADMIN-GRANT-" + Date.now(), expiry: expiryStr, package: `${days} Ngày (Admin cấp)` };
            localStorage.setItem(`user_key_${username}`, JSON.stringify(keyData));
            alert(`Đã cấp Key VIP cho user [${username}] thành công!`);
            loadUsersTable();
        }

        function revokeKey(username) {
            if (confirm(`Bạn có chắc muốn thu hồi Key của [${username}]?`)) {
                localStorage.removeItem(`user_key_${username}`);
                loadUsersTable();
            }
        }
    </script>
</body>
</html>
