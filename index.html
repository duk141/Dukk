<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiLo Markov 2 AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:15px;
}

.box{
  max-width:520px;
  margin:auto;
  background:#111827;
  padding:15px;
  border-radius:12px;
}

h2{text-align:center;}

.row{display:flex; gap:10px; margin-top:10px;}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
}

.high{background:#ef4444;color:white;}
.low{background:#22c55e;color:white;}
.skip{background:#f59e0b;color:black;}
.clear{background:#3b82f6;color:white;width:100%;margin-top:10px;}

#history{
  margin-top:12px;
  background:#0b1220;
  padding:10px;
  border-radius:8px;
  font-size:14px;
}

#ai{
  margin-top:12px;
  background:#1f2937;
  padding:10px;
  border-radius:8px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">
  <h2>🧠 Markov Bậc 2 HiLo AI</h2>

  <div class="row">
    <button class="high" onclick="add('H')">HIGH</button>
    <button class="low" onclick="add('L')">LOW</button>
    <button class="skip" onclick="add('S')">SKIP</button>
  </div>

  <button class="clear" onclick="clearAll()">CLEAR</button>

  <div id="ai">AI: chưa đủ dữ liệu</div>
  <div id="history"></div>
</div>

<script>

let data = [];

function add(v){
  data.push(v);
  render();
}

function clearAll(){
  data = [];
  render();
}

function render(){
  document.getElementById("history").innerText =
    "History: " + data.join(" ");

  analyze();
}

// ============================
// MARKOV ORDER 2 ENGINE
// ============================
function analyze(){

  let seq = data.filter(x => x !== "S");

  if(seq.length < 15){
    document.getElementById("ai").innerText =
      "AI: cần ít nhất 15 phiên để học Markov bậc 2";
    return;
  }

  // =========================
  // 1. BUILD 2-STEP MATRIX
  // =========================
  let states = ["H","L"];

  let trans2 = {};

  for(let a of states){
    for(let b of states){
      trans2[a+b] = {H:0, L:0};
    }
  }

  // =========================
  // 2. FILL TRANSITIONS
  // =========================
  for(let i=0;i<seq.length-2;i++){

    let key = seq[i] + seq[i+1];
    let next = seq[i+2];

    if(trans2[key]){
      trans2[key][next]++;
    }
  }

  // =========================
  // 3. GET CURRENT STATE
  // =========================
  let last1 = seq[seq.length-2];
  let last2 = seq[seq.length-1];

  let currentState = last1 + last2;

  if(!trans2[currentState]){
    document.getElementById("ai").innerText =
      "AI: trạng thái chưa đủ dữ liệu";
    return;
  }

  let total = trans2[currentState].H + trans2[currentState].L;

  let pH = total ? trans2[currentState].H / total : 0;
  let pL = total ? trans2[currentState].L / total : 0;

  let predict = pH > pL ? "HIGH" : "LOW";
  let confidence = Math.max(pH,pL) * 100;

  // =========================
  // 4. PATTERN INSIGHT
  // =========================
  let pattern = "";

  if(currentState === "HH"){
    pattern = "Sau HH → kiểm tra đảo hoặc bệt tiếp";
  }
  else if(currentState === "LL"){
    pattern = "Sau LL → thường dễ đảo hoặc kéo dài";
  }
  else if(currentState === "HL"){
    pattern = "HL = cầu gãy → biến động cao";
  }
  else if(currentState === "LH"){
    pattern = "LH = đảo nhịp → dễ flip tiếp";
  }

  // =========================
  // 5. TREND STRENGTH
  // =========================
  let stability =
    total < 3 ? "Yếu (ít dữ liệu)"
    : confidence > 0.65 ? "Rõ xu hướng"
    : "Nhiễu / khó đoán";

  // =========================
  // 6. OUTPUT
  // =========================
  document.getElementById("ai").innerHTML =
    "🎯 Dự đoán: " + predict +
    "<br>📊 Confidence: " + confidence.toFixed(1) + "%" +
    "<br>🧩 State: " + currentState +
    "<br>📈 Insight: " + pattern +
    "<br>🧠 Strength: " + stability;
}

</script>

</body>
</html>
