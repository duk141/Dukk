<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Baccarat API Tool</title>

<style>

body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:15px;
}

h1{
  text-align:center;
}

#tables{
  display:grid;
  gap:12px;
}

.card{
  background:#1d1d1d;
  padding:15px;
  border-radius:12px;
  border:1px solid #333;
}

.road{
  margin-top:10px;
  word-break:break-all;
  line-height:28px;
}

.B{
  color:#ff4d4d;
  font-weight:bold;
}

.P{
  color:#4da6ff;
  font-weight:bold;
}

.T{
  color:#33cc66;
  font-weight:bold;
}

.predict{
  margin-top:10px;
  font-size:22px;
  font-weight:bold;
  color:gold;
}

</style>
</head>

<body>

<h1>🎰 Baccarat Scanner</h1>

<div id="tables"></div>

<script>

// API của bạn
const API =
"https://employers-hormone-land-idaho.trycloudflare.com/api/bcr";

// load data
async function loadData(){

  try{

    const res =
      await fetch(API);

    const json =
      await res.json();

    renderTables(json.data);

  }catch(err){

    console.log(err);

  }

}

// render
function renderTables(data){

  const tables =
    document.getElementById("tables");

  tables.innerHTML = "";

  data.forEach(t => {

    const road =
      t.results || "";

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <h2>🎲 Bàn ${t.ban}</h2>

      <div>
      📌 ${t.good_road || "Không có cầu"}
      </div>

      <div class="road">
      ${renderRoad(road)}
      </div>

      <div class="predict">
      ${predict(road)}
      </div>

    `;

    tables.appendChild(div);

  });

}

// màu road
function renderRoad(road){

  return road.split("").map(x => {

    return `<span class="${x}">
      ${x}
    </span>`;

  }).join("");

}

// predict đơn giản
function predict(road){

  let last4 =
    road.slice(-4);

  // bệt banker
  if(last4==="BBBB")
    return "➡ Theo Banker";

  // bệt player
  if(last4==="PPPP")
    return "➡ Theo Player";

  // cầu đơn
  if(/BPBP$/.test(last4))
    return "➡ Đánh Player";

  if(/PBPB$/.test(last4))
    return "➡ Đánh Banker";

  // mặc định
  let last =
    road.slice(-1);

  if(last==="B")
    return "➡ Banker";

  if(last==="P")
    return "➡ Player";

  return "➡ Chờ";

}

// load lần đầu
loadData();

// auto refresh 5s
setInterval(loadData,5000);

</script>

</body>
</html>
