<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Dự Đoán Rồng Hổ</title>

<style>
body{
    margin:0;
    padding:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container{
    padding:20px;
}

h1{
    color:gold;
    margin-bottom:20px;
}

.history{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

.item{
    width:60px;
    height:60px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.dragon{
    background:#ef4444;
}

.tiger{
    background:#3b82f6;
}

.tie{
    background:#10b981;
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    font-size:28px;
    color:gold;
}

.stats{
    margin-top:20px;
    font-size:18px;
}

.clear{
    background:#f59e0b;
    color:white;
}
</style>
</head>
<body>

<div class="container">

<h1>🐉 TOOL DỰ ĐOÁN RỒNG HỔ 🐯</h1>

<div class="history" id="history"></div>

<div>
<button class="dragon" onclick="addResult('R')">Rồng</button>
<button class="tiger" onclick="addResult('H')">Hổ</button>
<button class="tie" onclick="addResult('T')">Hòa</button>
<button class="clear" onclick="resetGame()">Reset</button>
</div>

<div class="result" id="prediction">
Đợi dữ liệu...
</div>

<div class="stats" id="stats"></div>

</div>

<script>

let data = [];

function addResult(type){

    data.push(type);

    renderHistory();

    predict();

}

function renderHistory(){

    let historyDiv = document.getElementById("history");

    historyDiv.innerHTML = "";

    data.slice(-20).forEach(item => {

        let div = document.createElement("div");

        div.classList.add("item");

        if(item === "R"){
            div.classList.add("dragon");
            div.innerHTML = "R";
        }

        if(item === "H"){
            div.classList.add("tiger");
            div.innerHTML = "H";
        }

        if(item === "T"){
            div.classList.add("tie");
            div.innerHTML = "T";
        }

        historyDiv.appendChild(div);

    });

}

function predict(){

    if(data.length < 3){

        document.getElementById("prediction").innerHTML =
        "Cần thêm dữ liệu...";
        return;

    }

    let last = data[data.length - 1];
    let countR = 0;
    let countH = 0;

    data.forEach(x => {

        if(x === "R") countR++;
        if(x === "H") countH++;

    });

    let predictText = "";

    // AI logic fake demo

    if(last === "R"){

        predictText = "🔥 Dự đoán tiếp theo: HỔ";

    }else if(last === "H"){

        predictText = "🔥 Dự đoán tiếp theo: RỒNG";

    }else{

        predictText = "🔥 Dự đoán tiếp theo: RỒNG";
    }

    // cầu bệt

    let last3 = data.slice(-3);

    if(last3.every(x => x === "R")){

        predictText = "🐉 Cầu bệt RỒNG mạnh";

    }

    if(last3.every(x => x === "H")){

        predictText = "🐯 Cầu bệt HỔ mạnh";

    }

    document.getElementById("prediction").innerHTML =
    predictText;

    document.getElementById("stats").innerHTML =
    `
    Tổng Rồng: ${countR} <br>
    Tổng Hổ: ${countH} <br>
    Tổng ván: ${data.length}
    `;

}

function resetGame(){

    data = [];

    document.getElementById("history").innerHTML = "";

    document.getElementById("prediction").innerHTML =
    "Đợi dữ liệu...";

    document.getElementById("stats").innerHTML = "";

}

</script>

</body>
</html>
