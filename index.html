<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Baccarat API Tool</title>

<style>

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial;
  margin:0;
  padding:10px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

#tables{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));

  gap:12px;

}

.card{

  background:#1b1b1b;

  border-radius:14px;

  padding:14px;

  border:1px solid #2e2e2e;

  box-shadow:
  0 0 10px rgba(0,0,0,.4);

}

.top{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:10px;

}

.table-name{

  font-size:22px;

  font-weight:bold;

  color:gold;

}

.good-road{

  font-size:13px;

  color:#00d2ff;

}

.road{

  background:#101010;

  border-radius:10px;

  padding:10px;

  min-height:80px;

  line-height:30px;

  word-break:break-all;

}

.B{

  color:#ff4d4d;

  font-weight:bold;

  font-size:22px;

}

.P{

  color:#4da6ff;

  font-weight:bold;

  font-size:22px;

}

.T{

  color:#33cc66;

  font-weight:bold;

  font-size:22px;

}

.predict{

  margin-top:12px;

  background:#2a2a2a;

  padding:10px;

  border-radius:10px;

  text-align:center;

  font-size:20px;

  color:gold;

  font-weight:bold;

}

</style>
</head>

<body>

<h1>🎰 Baccarat Scanner</h1>

<div id="tables"></div>

<script>

// API của bạn
const API =
"https://YOUR_API_LINK";

// load data
async function loadData(){

  try{

    const res =
      await fetch(API);

    const json =
      await res.json();

    renderTables(json.data);

  }catch(err){

    console.log(err);

  }

}

// render
function renderTables(data){

  const tables =
    document.getElementById("tables");

  tables.innerHTML = "";

  data.forEach(t => {

    const road =
      t.results || "";

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `

<div class="top">

  <div class="table-name">
    🎲 ${t.ban}
  </div>

  <div class="good-road">
    ${t.good_road || "Không có cầu"}
  </div>

</div>

<div class="road">
  ${renderRoad(road)}
</div>

<div class="predict">
  ${predict(road)}
</div>

`;

    tables.appendChild(div);

  });

}

// màu road
function renderRoad(road){

  return road.split("").map(x => {

    return `<span class="${x}">
      ${x}
    </span>`;

  }).join("");

}

// predict đơn giản
function predict(road){

  let last4 =
    road.slice(-4);

  // bệt banker
  if(last4==="BBBB")
    return "➡ Theo Banker";

  // bệt player
  if(last4==="PPPP")
    return "➡ Theo Player";

  // cầu đơn
  if(/BPBP$/.test(last4))
    return "➡ Đánh Player";

  if(/PBPB$/.test(last4))
    return "➡ Đánh Banker";

  // mặc định
  let last =
    road.slice(-1);

  if(last==="B")
    return "➡ Banker";

  if(last==="P")
    return "➡ Player";

  return "➡ Chờ";

}

// load lần đầu
loadData();

// auto refresh 5s
setInterval(loadData,5000);

</script>

</body>
</html>
