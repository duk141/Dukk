<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Baccarat Lobby</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0f1a;
  color:white;
  padding:12px;
}

/* =========================
TITLE
========================= */

.title{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:18px;
  color:#00ffd5;
}

/* =========================
LOBBY
========================= */

.tables{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:12px;

}

.card{

  background:
  linear-gradient(
    145deg,
    #162033,
    #0d1524
  );

  border-radius:18px;

  padding:14px;

  border:1px solid #26354f;

  cursor:pointer;

  transition:.2s;

  box-shadow:
  0 0 15px rgba(0,0,0,.4);

}

.card:hover{

  transform:scale(1.02);

  border-color:#00ffd5;

}

.card-top{

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.table-name{

  font-size:24px;

  font-weight:bold;

  color:#00ffd5;

}

.online{

  background:#00c853;

  width:10px;

  height:10px;

  border-radius:50%;

  box-shadow:
  0 0 10px #00ff88;

}

.preview-road{

  display:flex;

  flex-wrap:wrap;

  gap:4px;

  margin-top:14px;

}

.dot{

  width:28px;

  height:28px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:12px;

  font-weight:bold;

}

.B{
  background:#1976ff;
}

.P{
  background:#ff2f6d;
}

.T{
  background:#00b16a;
}

/* =========================
POPUP
========================= */

.popup{

  position:fixed;

  inset:0;

  background:
  rgba(0,0,0,.7);

  display:none;

  justify-content:center;

  align-items:center;

  z-index:999;

}

.popup-box{

  width:95%;

  max-width:700px;

  background:#111827;

  border-radius:22px;

  padding:18px;

  border:1px solid #2d405f;

  animation:show .2s ease;

}

@keyframes show{

  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }

}

.popup-top{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:16px;

}

.room-name{

  font-size:28px;

  font-weight:bold;

  color:#00ffd5;

}

.close{

  background:#ff3355;

  border:none;

  color:white;

  width:40px;

  height:40px;

  border-radius:50%;

  font-size:18px;

  cursor:pointer;

}

/* =========================
PREDICT
========================= */

.predict{

  background:
  linear-gradient(
    145deg,
    #1b2a45,
    #121c30
  );

  border-radius:18px;

  padding:18px;

  text-align:center;

  margin-bottom:18px;

}

.predict-label{

  color:#aaa;

  margin-bottom:10px;

}

.predict-result{

  font-size:48px;

  font-weight:bold;

}

/* =========================
ROAD
========================= */

.road{

  display:flex;

  flex-wrap:nowrap;

  overflow-x:auto;

  gap:6px;

  padding-bottom:6px;

}

/* =========================
CHART
========================= */

.chart-box{

  margin-bottom:18px;

  background:#19263d;

  padding:14px;

  border-radius:16px;

}

.chart-item{

  margin-bottom:14px;

}

.chart-label{

  margin-bottom:6px;

  font-size:13px;

  color:#ccc;

}

.chart-bar-bg{

  width:100%;

  height:18px;

  background:#0f1726;

  border-radius:30px;

  overflow:hidden;

}

.chart-bar{

  height:100%;

  border-radius:30px;

  width:0%;

  transition:.3s;

}

.banker-bar{

  background:#1976ff;

}

.player-bar{

  background:#ff2f6d;

}

.tie-bar{

  background:#00b16a;

}

.chart-value{

  margin-top:4px;

  font-size:13px;

  color:#aaa;

}

/* =========================
HISTORY TITLE
========================= */

.history-title{

  font-size:18px;

  font-weight:bold;

  margin-bottom:12px;

  color:#00ffd5;

}

/* =========================
STATS
========================= */

.stats{

  margin-top:18px;

  background:#19263d;

  border-radius:16px;

  padding:14px;

  line-height:1.8;

  color:#ddd;

}

</style>
</head>
<body>

<div class="title">
  BACCARAT LOBBY
</div>

<div class="tables" id="tables"></div>

<!-- ========================= -->
<!-- POPUP -->
<!-- ========================= -->

<div class="popup" id="popup">

  <div class="popup-box">

    <div class="popup-top">

      <div class="room-name"
      id="roomName">
        C01
      </div>

      <button class="close"
      onclick="closePopup()">
        
      </button>

    </div>

<div class="predict">

  <div class="predict-label">
    D oán tip theo
  </div>

  <div class="predict-result"
  id="predictResult">
    B
  </div>

</div>

<!-- BIU  -->

<div class="chart-box">

  <div class="chart-item">

    <div class="chart-label">
      BANKER
    </div>

    <div class="chart-bar-bg">

      <div class="chart-bar banker-bar"
      id="bankerBar"></div>

    </div>

    <div class="chart-value"
    id="bankerText">
      0%
    </div>

  </div>

  <div class="chart-item">

    <div class="chart-label">
      PLAYER
    </div>

    <div class="chart-bar-bg">

      <div class="chart-bar player-bar"
      id="playerBar"></div>

    </div>

    <div class="chart-value"
    id="playerText">
      0%
    </div>

  </div>

  <div class="chart-item">

    <div class="chart-label">
      TIE
    </div>

    <div class="chart-bar-bg">

      <div class="chart-bar tie-bar"
      id="tieBar"></div>

    </div>

    <div class="chart-value"
    id="tieText">
      0%
    </div>

  </div>

</div>

<!-- LCH S CU -->

<div class="history-title">
  LCH S CU
</div>

<div class="road"
id="road"></div>

<div class="stats"
id="stats"></div>

  </div>

</div>

<script>

/* =========================
API
========================= */

const API =
"https://api.allorigins.win/raw?url=" +
encodeURIComponent(
  "https://employers-hormone-land-idaho.trycloudflare.com/api/bcr"
);

/* =========================
TABLES
========================= */

const TABLES = [];

for(let i=1;i<=20;i++){

  TABLES.push(
    "c" + String(i).padStart(2,"0")
  );

}

const allData = {};

const tablesDiv =
document.getElementById("tables");

/* =========================
RENDER LOBBY
========================= */

function renderLobby(){

  tablesDiv.innerHTML = "";

  TABLES.forEach(table=>{

    const results =
      allData[table] || [];

    const card =
      document.createElement("div");

    card.className = "card";

    card.onclick =
      ()=>openPopup(table);

    card.innerHTML = `

      <div class="card-top">

        <div class="table-name">
          ${table.toUpperCase()}
        </div>

        <div class="online"></div>

      </div>

      <div class="preview-road">

        ${results
        .slice(-12)
        .map(r=>`

          <div class="dot ${r}">
            ${r}
          </div>

        `).join("")}

      </div>

    `;

    tablesDiv.appendChild(card);

  });

}

/* =========================
OPEN POPUP
========================= */

function openPopup(table){

  document
  .getElementById("popup")
  .style.display = "flex";

  document
  .getElementById("roomName")
  .innerText =
    table.toUpperCase();

  renderRoom(
    allData[table] || []
  );

}

/* =========================
CLOSE POPUP
========================= */

function closePopup(){

  document
  .getElementById("popup")
  .style.display = "none";

}

/* =========================
PREDICT
========================= */

function predict(results){

  if(results.length < 2)
    return "B";

  const last =
    results[results.length-1];

  const last2 =
    results[results.length-2];

  // bt
  if(last === last2){

    return last;

  }

  // o
  if(last === "B")
    return "P";

  if(last === "P")
    return "B";

  return "B";

}

/* =========================
RENDER ROOM
========================= */

function renderRoom(results){

  const road =
    document.getElementById("road");

  if(!road) return;

  road.innerHTML = "";

  /*
  LỊCH SỬ CẦU
  */

  (results || []).forEach(r=>{

    road.innerHTML += `

      <div class="dot ${r}">
        ${r}
      </div>

    `;

  });

  /*
  DỰ ĐOÁN
  */

  const next =
    predict(results);

  const predictBox =
    document.getElementById("predictResult");

  if(predictBox){

    predictBox.className =
      `predict-result ${next}`;

    predictBox.innerText =
      next;

  }

  /*
  THỐNG KÊ
  */

  const b =
    results.filter(x=>x==="B").length;

  const p =
    results.filter(x=>x==="P").length;

  const t =
    results.filter(x=>x==="T").length;

  const total =
    results.length || 1;

  /*
  %
  */

  const bPercent =
    ((b/total)*100).toFixed(0);

  const pPercent =
    ((p/total)*100).toFixed(0);

  const tPercent =
    ((t/total)*100).toFixed(0);

  /*
  UPDATE BAR
  */

  const bankerBar =
    document.getElementById("bankerBar");

  const playerBar =
    document.getElementById("playerBar");

  const tieBar =
    document.getElementById("tieBar");

  if(bankerBar)
    bankerBar.style.width =
      bPercent + "%";

  if(playerBar)
    playerBar.style.width =
      pPercent + "%";

  if(tieBar)
    tieBar.style.width =
      tPercent + "%";

  /*
  UPDATE TEXT
  */

  const bankerText =
    document.getElementById("bankerText");

  const playerText =
    document.getElementById("playerText");

  const tieText =
    document.getElementById("tieText");

  if(bankerText)
    bankerText.innerText =
      bPercent + "%";

  if(playerText)
    playerText.innerText =
      pPercent + "%";

  if(tieText)
    tieText.innerText =
      tPercent + "%";

  /*
  STATS
  */

  const stats =
    document.getElementById("stats");

if(stats){

  stats.innerHTML = `

    Banker: ${b}<br>
    Player: ${p}<br>
    Tie: ${t}<br>
    Tổng lịch sử: ${results.length}

  `;

}

road.scrollLeft =
road.scrollWidth;

}

/* =========================
LOAD API
========================= */

/*
Ví d JSON API:

{
  "c01":["B","P","B"],
  "c02":["P","P","B"]
}
*/

async function loadAPI(){

  try{

    const res =
      await fetch(API);

    const text =
      await res.text();

    console.log(text);

    const json =
      JSON.parse(text);

    /*
    DEBUG
    */

    console.log(json);
    
    console.log(json.c01);

    TABLES.forEach(table=>{

  let data =
    json[table];

  /*
  FIX NULL
  */

  if(!data){

    data = [];

  }

  /*
  STRING
  */

  if(typeof data === "string"){

    data =
      data
      .replace(/\s/g,"")
      .split(",");

  }

  /*
  OBJECT
  */

  if(Array.isArray(data)){

    data =
      data.map(x=>{

        /*
        1 = Banker
        2 = Player
        3 = Tie
        */

        if(x === 1) return "B";
        if(x === 2) return "P";
        if(x === 3) return "T";

        return x;

      });

  }

  /*
  CH GI B P T
  */

  data =
    data.filter(x=>
      x==="B" ||
      x==="P" ||
      x==="T"
    );

  allData[table] = data;

});

    renderLobby();
    const popup =
document.getElementById("popup");

if(
  popup.style.display === "flex"
){

  const current =
    document
    .getElementById("roomName")
    .innerText
    .toLowerCase();

  renderRoom(
    allData[current] || []
  );

}

    /*
    popup ang m
    */

    const current =
      document
      .getElementById("roomName")
      .innerText
      .toLowerCase();

    if(TABLES.includes(current)){

      renderRoom(
        allData[current]
      );

    }

  }catch(err){

    console.log(
      "API ERROR",
      err
    );

  }

}

loadAPI();

setInterval(loadAPI,1000);

</script>

</body>
</html>
