<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AVIATOR SHA512 ANALYZER AI</title>

<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f1115;
  color:white;
  padding:15px;
}

h1{
  text-align:center;
  margin-bottom:20px;
  color:#00ffae;
}

.box{
  background:#1b1f27;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
  border:1px solid #2d3442;
}

.title{
  font-size:18px;
  margin-bottom:12px;
  color:#00ffae;
}

input,textarea{

  width:100%;
  background:#0b0d11;
  border:none;
  color:white;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  font-size:15px;

}

button{

  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#00ffae;
  color:black;
  font-size:16px;
  font-weight:bold;

}

.result{

  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#11151c;
  line-height:1.8;

}

.history{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.item{

  min-width:70px;
  text-align:center;
  padding:10px;
  border-radius:10px;
  font-weight:bold;

}

.red{
  background:#ff4b4b;
}

.green{
  background:#00c853;
}

.yellow{
  background:#ffb300;
  color:black;
}

.predict{

  font-size:24px;
  text-align:center;
  margin-top:15px;
  font-weight:bold;

}

.bar{

  width:100%;
  height:20px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;

}

.fill{

  height:100%;
  width:0%;
  background:#00ffae;

}

.live{

  margin-top:12px;
  font-size:15px;
  line-height:1.8;

}

</style>
</head>

<body>

<h1>AVIATOR AI ANALYZER</h1>

<!-- VERIFY -->

<div class="box">

<div class="title">
SHA512 VERIFY
</div>

<input
id="server"
placeholder="Server Seed"
/>

<input
id="client"
placeholder="Client Seed"
/>

<button onclick="verifyHash()">
VERIFY HASH
</button>

<div class="result" id="verifyResult">
...
</div>

</div>

<!-- HASH -->

<div class="box">

<div class="title">
HASH → CRASH
</div>

<input
id="hashInput"
placeholder="Nhập SHA512 Hash"
/>

<button onclick="hashToCrash()">
TÍNH CRASH
</button>

<div class="result" id="crashResult">
...
</div>

</div>

<!-- HISTORY -->

<div class="box">

<div class="title">
AI PREDICTOR
</div>

<textarea
id="historyInput"
rows="6"
placeholder="1.12,1.44,2.55..."
></textarea>

<button onclick="analyzeAI()">
PHÂN TÍCH AI
</button>

<div class="predict" id="predict">
...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="history" id="history">
</div>

<div class="live" id="live">
</div>

</div>

<script>

let autoData = [];

function verifyHash(){

  let server =
    document.getElementById("server")
    .value.trim();

  let client =
    document.getElementById("client")
    .value.trim();

  let combined =
    server + client;

  let hash =
    CryptoJS.SHA512(combined)
    .toString();

  document.getElementById("verifyResult")
    .innerHTML = `

    SHA512:<br><br>

    ${hash}

    `;

}

function hashToCrash(){

  let hash =
    document.getElementById("hashInput")
    .value.trim();

  if(hash.length < 13){

    alert("Hash không hợp lệ");
    return;

  }

  let hex =
    hash.substring(0,13);

  let decimal =
    parseInt(hex,16);

  let e =
    Math.pow(2,52);

  let crash =
    (100 * e - decimal) /
    (e - decimal);

  crash =
    Math.floor(crash)/100;

  document.getElementById("crashResult")
    .innerHTML = `

    HEX:<br>
    ${hex}

    <br><br>

    DECIMAL:<br>
    ${decimal}

    <br><br>

    CRASH:<br>
    <b>${crash.toFixed(2)}x</b>

    `;

}

function analyzeAI(){

  let raw =
    document.getElementById("historyInput")
    .value;

  let arr =
    raw.split(",")
    .map(v=>parseFloat(v.trim()))
    .filter(v=>!isNaN(v));

  autoData = arr;

  renderHistory(arr);

  aiPredict(arr);

}

function renderHistory(arr){

  let html = "";

  arr.slice().reverse().forEach(v=>{

    let cls = "green";

    if(v < 2){
      cls = "red";
    }

    if(v >= 10){
      cls = "yellow";
    }

    html += `

      <div class="item ${cls}">
        ${v.toFixed(2)}x
      </div>

    `;

  });

  document.getElementById("history")
    .innerHTML = html;

}

function aiPredict(arr){

  if(arr.length < 10){

    document.getElementById("predict")
      .innerText = "LEARNING";

    return;

  }

  let last10 =
    arr.slice(-10);

  let red =
    last10.filter(v=>v<2).length;

  let green =
    last10.filter(v=>v>=2).length;

  let high =
    last10.filter(v=>v>=10).length;

  let avg =
    last10.reduce((a,b)=>a+b,0)
    / last10.length;

  let confidence = 50;

  if(red >= 7){

    confidence += 25;

  }

  if(avg < 2){

    confidence += 15;

  }

  if(high >= 2){

    confidence -= 10;

  }

  if(confidence > 100){
    confidence = 100;
  }

  let signal = "WAIT";

  if(confidence >= 75){

    signal = "🔥 HIGH GREEN";

  }else if(confidence >= 60){

    signal = "📈 POSSIBLE GREEN";

  }else{

    signal = "⚠️ LOW CONFIDENCE";

  }

  document.getElementById("predict")
    .innerText = signal;

  document.getElementById("fill")
    .style.width =
    confidence + "%";

  document.getElementById("live")
    .innerHTML = `

    🔴 Red (<2x):
    ${red}

    <br>

    🟢 Green (>=2x):
    ${green}

    <br>

    💥 High (10x+):
    ${high}

    <br>

    📊 AVG:
    ${avg.toFixed(2)}x

    <br>

    🎯 Confidence:
    ${confidence}%

    `;

}

setInterval(()=>{

  if(autoData.length > 0){

    aiPredict(autoData);

  }

},2000);

</script>

</body>
</html>
