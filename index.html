<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiLo A→K AI</title>

<style>

body{
  margin:0;
  padding:15px;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

.box{
  max-width:700px;
  margin:auto;
  background:#111827;
  padding:15px;
  border-radius:12px;
}

h2{
  text-align:center;
  margin-bottom:15px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.card-btn{
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  background:#1e293b;
  color:white;
}

.card-btn:hover{
  opacity:0.9;
}

.low{
  background:#16a34a;
}

.high{
  background:#dc2626;
}

.control{
  margin-top:15px;
  display:flex;
  gap:10px;
}

.control button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.clear{
  background:#2563eb;
  color:white;
}

.skip{
  background:#f59e0b;
  color:black;
}

#history,
#ai{
  margin-top:15px;
  background:#0b1220;
  padding:12px;
  border-radius:10px;
  font-size:14px;
  line-height:1.6;
}

.tag{
  display:inline-block;
  padding:3px 8px;
  border-radius:6px;
  margin-left:5px;
  font-size:12px;
  font-weight:bold;
}

.tag-low{
  background:#16a34a;
}

.tag-high{
  background:#dc2626;
}

</style>
</head>

<body>

<div class="box">

  <h2>🃏 HiLo A → K AI</h2>

  <div class="cards">

    <button class="card-btn low" onclick="addCard('A')">A</button>
    <button class="card-btn low" onclick="addCard('2')">2</button>
    <button class="card-btn low" onclick="addCard('3')">3</button>
    <button class="card-btn low" onclick="addCard('4')">4</button>

    <button class="card-btn low" onclick="addCard('5')">5</button>
    <button class="card-btn low" onclick="addCard('6')">6</button>
    <button class="card-btn low" onclick="addCard('7')">7</button>

    <button class="card-btn high" onclick="addCard('8')">8</button>
    <button class="card-btn high" onclick="addCard('9')">9</button>
    <button class="card-btn high" onclick="addCard('10')">10</button>

    <button class="card-btn high" onclick="addCard('J')">J</button>
    <button class="card-btn high" onclick="addCard('Q')">Q</button>
    <button class="card-btn high" onclick="addCard('K')">K</button>

  </div>

  <div class="control">
    <button class="skip" onclick="skip()">SKIP</button>
    <button class="clear" onclick="clearAll()">CLEAR</button>
  </div>

  <div id="ai">
    AI: Chưa đủ dữ liệu
  </div>

  <div id="history">
    History:
  </div>

</div>

<script>

let rawCards = [];
let data = [];

// =======================
// AUTO LOAD HISTORY
// =======================
const savedRaw =
  localStorage.getItem("hilo_raw");

const savedData =
  localStorage.getItem("hilo_data");

if(savedRaw && savedData){

  rawCards = JSON.parse(savedRaw);
  data = JSON.parse(savedData);

  setTimeout(()=>{
    render();
  },100);
}

// =======================
// SAVE HISTORY
// =======================
function saveHistory(){

  localStorage.setItem(
    "hilo_raw",
    JSON.stringify(rawCards)
  );

  localStorage.setItem(
    "hilo_data",
    JSON.stringify(data)
  );
}

// =======================
// CARD => H/L
// =======================
function toHL(card){

  if(["A","2","3","4","5","6","7"].includes(card)){
    return "L";
  }

  return "H";
}

// =======================
// ADD CARD
// =======================
function addCard(card){

  rawCards.push(card);

  let hl = toHL(card);

  data.push(hl);

  saveHistory();

  render();
}

// =======================
function skip(){

  rawCards.push("S");
  data.push("S");

  saveHistory();

  render();
}

// =======================
function clearAll(){

  rawCards = [];
  data = [];

  localStorage.clear();

  render();
}

// =======================
// RENDER
// =======================
function render(){

  let html = "";

  rawCards.forEach(c=>{

    if(c==="S"){
      html += "[SKIP] ";
      return;
    }

    let type = toHL(c);

    html += `
      ${c}
      <span class="tag ${type==='H' ? 'tag-high':'tag-low'}">
        ${type}
      </span>
    `;
  });

  document.getElementById("history").innerHTML =
    html || "History:";

  analyze();
}

// =======================
// AI ANALYZE
// =======================
function analyze(){

  let seq = data.filter(x=>x!=="S");

  if(seq.length < 5){

    document.getElementById("ai").innerHTML =
      "AI: cần ít nhất 5 lá";

    return;
  }

  // ===================
  // STREAK
  // ===================
  let last = seq[seq.length-1];

  let streak = 1;

  for(let i=seq.length-2;i>=0;i--){

    if(seq[i]===last){
      streak++;
    }else{
      break;
    }
  }

  // ===================
  // PATTERN
  // ===================
  let last6 = seq.slice(-6).join("");

  let pattern = "Không rõ";

  if(last6==="HLHLHL" || last6==="LHLHLH"){
    pattern = "🔁 Cầu 1-1";
  }
  else if(
    last6.includes("HLL") ||
    last6.includes("LHH")
  ){
    pattern = "📈 Cầu 1-2";
  }
  else if(streak>=3){
    pattern = "🔥 Bệt";
  }

  // ===================
  // SẮP ĐẢO
  // ===================
  let reverse = false;

  if(streak>=3){
    reverse = true;
  }

  // ===================
  // CẦU GÃY
  // ===================
  let broken = false;

  let flip = 0;

  for(let i=1;i<seq.length;i++){

    if(seq[i]!==seq[i-1]){
      flip++;
    }
  }

  let flipRate = flip / seq.length;

  if(flipRate > 0.7){
    broken = true;
  }

  // ===================
  // AI OUTPUT
  // ===================
  let msg = "";

  msg += "🧠 Pattern: " + pattern + "<br>";
  msg += "📊 Streak: " + last + " x" + streak + "<br>";

  if(reverse){
    msg += "⚠️ Sắp đảo cầu<br>";
  }

  if(broken){
    msg += "💥 Cầu gãy / nhiễu<br>";
  }

  if(!reverse && !broken){
    msg += "✅ Cầu ổn định<br>";
  }

  document.getElementById("ai").innerHTML = msg;
}

</script>

</body>
</html>
