<!DOCTYPE html>  <html lang="vi">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport"  
content="width=device-width, initial-scale=1.0">  <title>TX FLOAT</title>
<style>  
  
*{  
  margin:0;  
  padding:0;  
  box-sizing:border-box;  
  font-family:Arial;  
}  
  
body{  
  overflow:hidden;  
  background:#111;  
}  
  
/* GAME */  
  
#game{  
  position:fixed;  
  inset:0;  
  width:100%;  
  height:100%;  
  border:none;  
}  

/* ROBOT */

#robot{

  position:fixed;

  top:120px;
  left:10px;

  z-index:999999;

  user-select:none;

  touch-action:none;
}

/* HEAD */

#robotHead{

  width:70px;
  height:70px;

  border-radius:50%;

  background:#111;

  border:4px solid #00ff90;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:34px;

  box-shadow:
  0 0 20px #00ff90;

  margin:auto;

  cursor:move;
}

/* BODY */

#robotBody{

  margin-top:8px;

  width:220px;

  background:#111;

  border:2px solid #00ff90;

  border-radius:20px;

  padding:12px;

  color:white;

  box-shadow:
  0 0 20px rgba(0,255,144,.5);
}

/* TEXT */

.line{

  margin-bottom:10px;

  font-size:15px;

  font-weight:bold;

  line-height:1.5;
}

.predictText{

  color:#00ff90;

  font-size:17px;
}

  
</style> 

</head> 

<body>  <!-- GAME -->  <iframe  
id="game"  
src="https://play.sum.vin/">  
</iframe>  <!-- FLOAT -->  
<!-- ROBOT -->

<div id="robot">

  <div id="robotHead">
    🤖
  </div>

  <div id="robotBody">

    <div class="line">
      📌 Phiên:
      <span id="session">
        #0000
      </span>
    </div>

    <div class="line">
      🎯 Ván trước:
      <span id="result">
        ...
      </span>
    </div>

    <div class="line predictText">
      🔮
      <span id="predict">
        ĐANG PHÂN TÍCH
      </span>
    </div>

    <div class="line">
      📅
      <span id="date">
        ...
      </span>
    </div>

  </div>

</div>
<script>

// ===================
// API
// ===================

const API =
"https://corsproxy.io/?https://cricket-compressed-list-suppose.trycloudflare.com/api/md5";

// ===================
// DATA
// ===================

let historyData =
JSON.parse(
localStorage.getItem("tx")
) || [];

let lastSession = "";

// ===================
// NORMALIZE
// ===================

function normalizeResult(text){

  if(!text) return "";

  text = text
  .toString()
  .trim()
  .toLowerCase();

  if(
    text.includes("tài")
    || text.includes("tai")
  ){
    return "tai";
  }

  return "xiu";
}

// ===================
// GET API
// ===================

async function getData(){

  try{

    let res =
    await fetch(API,{

      method:"GET",

      cache:"no-cache",

      headers:{
        "Accept":"application/json"
      }

    });

    if(!res.ok){

      throw new Error("API ERROR");

    }

    let data =
    await res.json();

    console.log(data);

    if(
      !data
      || !data.phien
    ){
      return;
    }

    let currentSession =
    String(data.phien);

    if(
      currentSession
      === lastSession
    ){
      return;
    }

    lastSession =
    currentSession;

    updateUI(data);

  }catch(err){

    console.log(
      "API ERROR:",
      err
    );

    document
    .getElementById("predict")
    .innerHTML =
    "LỖI API";
  }
}

// ===================
// UPDATE UI
// ===================

function updateUI(data){

  // SESSION

  document
  .getElementById("session")
  .innerHTML =
  "#" + data.phien;

  // RESULT

  let result =
  normalizeResult(
    data.ket_qua
  );

  document
  .getElementById("result")
  .innerHTML =
  result==="tai"
  ? "TÀI"
  : "XỈU";

  // HISTORY

  historyData.push(result);

  if(historyData.length > 20){

    historyData.shift();

  }

  localStorage.setItem(
    "tx",
    JSON.stringify(historyData)
  );

  // PREDICT

  let next =
  analyze();

  document
  .getElementById("predict")
  .innerHTML =
  "DỰ ĐOÁN " + next;

  // DATE

  document
  .getElementById("date")
  .innerHTML =
  data.update_at || "...";

}

// ===================
// AI
// ===================

function analyze(){

  // =====================
  // CHƯA ĐỦ DỮ LIỆU
  // =====================

  if(historyData.length < 6){

    return "ĐANG HỌC";

  }

  // =====================
  // DATA
  // =====================

  let h =
  historyData;

  let last1 =
  h[h.length-1];

  let last2 =
  h[h.length-2];

  let last3 =
  h.slice(-3);

  let last4 =
  h.slice(-4);

  let last5 =
  h.slice(-5);

  let last6 =
  h.slice(-6);

  let p3 =
  last3.join("-");

  let p4 =
  last4.join("-");

  let p5 =
  last5.join("-");

  let p6 =
  last6.join("-");

  // =====================
  // ĐẾM 10 PHIÊN
  // =====================

  let tai = 0;
  let xiu = 0;

  h.slice(-10).forEach(i=>{

    if(i==="tai"){

      tai++;

    }else{

      xiu++;

    }

  });

  // =====================
  // CẦU BỆT
  // =====================

  // TTT

  if(
    last3.every(
      x=>x==="tai"
    )
  ){

    return "XỈU";

  }

  // XXX

  if(
    last3.every(
      x=>x==="xiu"
    )
  ){

    return "TÀI";

  }

  // =====================
  // CẦU ĐƠN
  // =====================

  // T X T X

  if(
    p4===
    "tai-xiu-tai-xiu"
  ){

    return "TÀI";

  }

  // X T X T

  if(
    p4===
    "xiu-tai-xiu-tai"
  ){

    return "XỈU";

  }

  // =====================
  // CẦU ĐÔI
  // =====================

  // TT XX

  if(
    p4===
    "tai-tai-xiu-xiu"
  ){

    return "TÀI";

  }

  // XX TT

  if(
    p4===
    "xiu-xiu-tai-tai"
  ){

    return "XỈU";

  }

  // =====================
  // CẦU KÉP
  // =====================

  // TXX

  if(
    p3===
    "tai-xiu-xiu"
  ){

    return "TÀI";

  }

  // XTT

  if(
    p3===
    "xiu-tai-tai"
  ){

    return "XỈU";

  }

  // =====================
  // CẦU ĐẢO
  // =====================

  if(last1 !== last2){

    return last1==="tai"
    ? "XỈU"
    : "TÀI";

  }

  // =====================
  // CẦU 1-2-3
  // =====================

  // T XX TTT

  if(
    p6===
    "tai-xiu-xiu-tai-tai-tai"
  ){

    return "XỈU";

  }

  // X TT XXX

  if(
    p6===
    "xiu-tai-tai-xiu-xiu-xiu"
  ){

    return "TÀI";

  }

  // =====================
  // CẦU 3-2-1
  // =====================

  // TTT XX T

  if(
    p6===
    "tai-tai-tai-xiu-xiu-tai"
  ){

    return "XỈU";

  }

  // XXX TT X

  if(
    p6===
    "xiu-xiu-xiu-tai-tai-xiu"
  ){

    return "TÀI";

  }

  // =====================
  // CẦU 2-1-2
  // =====================

  // TT X TT

  if(
    p5===
    "tai-tai-xiu-tai-tai"
  ){

    return "XỈU";

  }

  // XX T XX

  if(
    p5===
    "xiu-xiu-tai-xiu-xiu"
  ){

    return "TÀI";

  }

  // =====================
  // NGHIÊNG CẦU
  // =====================

  if(tai >= 8){

    return "XỈU";

  }

  if(xiu >= 8){

    return "TÀI";

  }

  // =====================
  // PHÂN TÍCH NHỊP
  // =====================

  let streak = 1;

  for(
    let i=h.length-1;
    i>0;
    i--
  ){

    if(h[i]===h[i-1]){

      streak++;

    }else{

      break;

    }
  }

  // bệt dài đảo

  if(streak >= 4){

    return last1==="tai"
    ? "XỈU"
    : "TÀI";

  }

  // =====================
  // AI RANDOM THÔNG MINH
  // =====================

  let scoreTai = 0;
  let scoreXiu = 0;

  // thống kê

  if(tai > xiu){

    scoreTai += 2;

  }else{

    scoreXiu += 2;

  }

  // nhịp cuối

  if(last1==="tai"){

    scoreTai++;

  }else{

    scoreXiu++;

  }

  // random nhẹ

  let rand =
  Math.random();

  if(rand > 0.5){

    scoreTai++;

  }else{

    scoreXiu++;

  }

  // =====================
  // FINAL
  // =====================

  return scoreTai >= scoreXiu
  ? "TÀI"
  : "XỈU";

}

// ===================
// DRAG ROBOT
// ===================

const robot =
document.getElementById("robot");

let isDragging = false;

let offsetX = 0;
let offsetY = 0;

// MOBILE

robot.addEventListener(
"touchstart",
e=>{

  isDragging = true;

  offsetX =
  e.touches[0].clientX
  - robot.offsetLeft;

  offsetY =
  e.touches[0].clientY
  - robot.offsetTop;
});

document.addEventListener(
"touchmove",
e=>{

  if(!isDragging) return;

  robot.style.left =
  (
    e.touches[0].clientX
    - offsetX
  ) + "px";

  robot.style.top =
  (
    e.touches[0].clientY
    - offsetY
  ) + "px";
});

document.addEventListener(
"touchend",
()=>{

  isDragging = false;

});

// PC

robot.addEventListener(
"mousedown",
e=>{

  isDragging = true;

  offsetX =
  e.clientX
  - robot.offsetLeft;

  offsetY =
  e.clientY
  - robot.offsetTop;
});

document.addEventListener(
"mousemove",
e=>{

  if(!isDragging) return;

  robot.style.left =
  (
    e.clientX
    - offsetX
  ) + "px";

  robot.style.top =
  (
    e.clientY
    - offsetY
  ) + "px";
});

document.addEventListener(
"mouseup",
()=>{

  isDragging = false;

});

// ===================
// AUTO
// ===================

getData();

setInterval(()=>{

  getData();

},5000);

</script>
