<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Baccarat Tool</title>

<style>

body{
  background:#101010;
  color:white;
  font-family:Arial;
  margin:0;
  padding:10px;
}

h1{
  text-align:center;
}

#tables{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(150px,1fr));

  gap:10px;

}

.card{

  background:#1d1d1d;

  border-radius:12px;

  padding:20px;

  text-align:center;

  border:1px solid #333;

  cursor:pointer;

  transition:.2s;

}

.card:hover{
  transform:scale(1.03);
}

.table-name{
  font-size:22px;
  font-weight:bold;
  color:gold;
}

.good-road{
  margin-top:10px;
  color:#00d0ff;
  font-size:13px;
}

/* MODAL */

#modal{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.8);

  display:none;

  align-items:center;

  justify-content:center;

  z-index:999;

}

.modal-box{

  width:95%;

  max-width:700px;

  background:#1b1b1b;

  border-radius:15px;

  padding:20px;

}

.close{

  float:right;

  cursor:pointer;

  font-size:28px;

  color:red;

}

.road{

  margin-top:20px;

  background:#111;

  padding:15px;

  border-radius:10px;

  line-height:30px;

  word-break:break-all;

}

.B{
  color:#ff4d4d;
  font-size:24px;
  font-weight:bold;
}

.P{
  color:#4da6ff;
  font-size:24px;
  font-weight:bold;
}

.T{
  color:#33cc66;
  font-size:24px;
  font-weight:bold;
}

.predict{

  margin-top:20px;

  background:
  linear-gradient(
    135deg,
    #2d1b00,
    #4d3200
  );

  border:1px solid gold;

  padding:18px;

  border-radius:14px;

  text-align:center;

  font-size:22px;

  color:gold;

  font-weight:bold;

  line-height:34px;

}

.stats{

  margin-top:15px;

  display:flex;

  gap:10px;

}

.last-result{

  margin-top:20px;

  background:#181818;

  border:1px solid #333;

  padding:15px;

  border-radius:12px;

  text-align:center;

  font-size:24px;

  font-weight:bold;

}

.box{

  flex:1;

  background:#222;

  padding:10px;

  border-radius:10px;

  text-align:center;

}

</style>
</head>

<body>

<h1>🎰 Baccarat Scanner</h1>

<div id="tables"></div>

<!-- MODAL -->

<div id="modal">

  <div class="modal-box">

    <div class="close"
    onclick="closeModal()">
      ×
    </div>

    <div id="detail"></div>

  </div>

</div>

<script>

const API =
"https://corsproxy.io/?https://employers-hormone-land-idaho.trycloudflare.com/api/bcr";

let allTables = [];

// load API
async function loadData(){

  const res =
    await fetch(API);

  const json =
    await res.json();

  allTables = json.data;

  renderTables();

}

// render list
function renderTables(){

  const tables =
    document.getElementById("tables");

  tables.innerHTML = "";

  allTables.forEach((t,i)=>{

    const div =
      document.createElement("div");

    div.className = "card";

    div.onclick = () => openTable(i);

    div.innerHTML = `

      <div class="table-name">
        🎲 ${t.ban}
      </div>

      <div class="good-road">
        ${t.good_road || "Không có cầu"}
      </div>

    `;

    tables.appendChild(div);

  });

}

// mở bàn
function openTable(index){

  const t =
    allTables[index];

  const road =
    t.results || "";

  let banker =
    (road.match(/B/g)||[]).length;

  let player =
    (road.match(/P/g)||[]).length;

  let tie =
    (road.match(/T/g)||[]).length;

  document.getElementById("detail")
  .innerHTML = `

    <h2>
      🎲 Bàn ${t.ban}
    </h2>

    <div>
      📌 ${t.good_road || "Không có cầu"}
    </div>

    <div class="road">
      ${renderRoad(road)}
    </div>

<div class="last-result">

  🎯 Ván trước:
  <br><br>

  ${lastResult(road)}

</div>

<div class="predict">

  ${predict(road)}

</div>

    <div class="stats">

      <div class="box">
        Banker<br>${banker}
      </div>

      <div class="box">
        Player<br>${player}
      </div>

      <div class="box">
        Tie<br>${tie}
      </div>

    </div>

  `;

  document.getElementById("modal")
  .style.display = "flex";

}

// đóng
function closeModal(){

  document.getElementById("modal")
  .style.display = "none";

}

// render road
function renderRoad(road){

  return road.split("").map(x=>{

    return `<span class="${x}">
      ${x}
    </span>`;

  }).join("");

}

// predict
function predict(road){

  if(!road || road.length < 4)
    return "Chờ dữ liệu";

  let last =
    road.slice(-1);

  let last2 =
    road.slice(-2);

  let last4 =
    road.slice(-4);

  // bệt banker
  if(last4 === "BBBB"){

    return `
      🔥 Bệt Banker
      <br>
      ➡ Nên theo Banker
    `;

  }

  // bệt player
  if(last4 === "PPPP"){

    return `
      🔥 Bệt Player
      <br>
      ➡ Nên theo Player
    `;

  }

  // cầu đơn
  if(/BPBP$/.test(last4)){

    return `
      🔄 Cầu đơn
      <br>
      ➡ Dự đoán Player
    `;

  }

  if(/PBPB$/.test(last4)){

    return `
      🔄 Cầu đơn
      <br>
      ➡ Dự đoán Banker
    `;

  }

  // 2 banker
  if(last2 === "BB"){

    return `
      📈 Banker đang mạnh
      <br>
      ➡ Ưu tiên Banker
    `;

  }

  // 2 player
  if(last2 === "PP"){

    return `
      📉 Player đang mạnh
      <br>
      ➡ Ưu tiên Player
    `;

  }

  // fallback
  if(last==="B"){

    return `
      🎯 Dự đoán Banker
    `;

  }

  return `
    🎯 Dự đoán Player
  `;

}

function lastResult(road){

  if(!road || road.length===0)
    return "Chưa có";

  let last =
    road.slice(-1);

  if(last==="B")
    return "🔴 Banker";

  if(last==="P")
    return "🔵 Player";

  return "🟢 Tie";

}

loadData();

setInterval(loadData,5000);

</script>

</body>
</html>
