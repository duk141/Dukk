<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MD5 Multi User Bot</title>

<style>

body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:#111827;
  padding:20px;
  border-radius:20px;
}

h1{
  text-align:center;
  color:#38bdf8;
  margin-bottom:20px;
}

input{
  width:100%;
  height:50px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  padding:10px;
  background:#1e293b;
  color:white;
  font-size:15px;
}

button{
  width:100%;
  height:50px;
  background:#0ea5e9;
  border:none;
  border-radius:10px;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:20px;
  padding:15px;
  background:#1e293b;
  border-radius:10px;
  text-align:center;
}

.big{
  color:#22c55e;
  font-size:40px;
  font-weight:bold;
}

.small{
  color:#ef4444;
  font-size:40px;
  font-weight:bold;
}

.info{
  margin-top:10px;
}

.history{
  margin-top:15px;
}

.item{
  background:#1e293b;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  font-size:14px;
}

</style>
</head>

<body>

<div class="box">

<h1>MD5 TELEGRAM MULTI BOT</h1>

<!-- TOKEN CHỈ NHẬP 1 LẦN -->
<input id="token" placeholder="8825094691:AAFgqjoxw4URi117sZhmvcfEeFlMbeHreW4">

<!-- MD5 USER -->
<input id="md5" placeholder="User nhập MD5...">

<button onclick="run()">
DỰ ĐOÁN + GỬI TELEGRAM
</button>

<div class="result" id="result">
Chưa có dữ liệu
</div>

<div class="history" id="history"></div>

</div>

<script>

let historyData = [];

// lưu token toàn cục
let BOT_TOKEN = "";

function run(){

  const tokenInput =
    document.getElementById("token").value.trim();

  const md5 =
    document.getElementById("md5").value.trim().toLowerCase();

  // lưu token 1 lần
  if(tokenInput !== ""){
    BOT_TOKEN = tokenInput;
    localStorage.setItem("bot_token", BOT_TOKEN);
  }

  // load lại token nếu có
  if(BOT_TOKEN === ""){
    BOT_TOKEN = localStorage.getItem("bot_token") || "";
  }

  if(BOT_TOKEN === ""){
    alert("Chưa có TOKEN");
    return;
  }

  if(md5.length < 10){
    alert("MD5 không hợp lệ");
    return;
  }

  let big = 0;
  let small = 0;

  for(let c of md5){

    if(/[0-9]/.test(c)){
      let n = parseInt(c);
      if(n >= 5) big += 2;
      else small += 2;
    }else{
      let code = c.charCodeAt(0);
      if(code % 2 === 0) big++;
      else small++;
    }

  }

  // chống lặp
  if(historyData.length >= 2){
    let a = historyData.at(-1);
    let b = historyData.at(-2);

    if(a === b){
      if(a === "BIG") small += 4;
      else big += 4;
    }
  }

  let result = big >= small ? "BIG" : "SMALL";

  let percent = Math.floor(
    Math.max(big,small) / (big+small) * 100
  );

  historyData.push(result);

  document.getElementById("result").innerHTML = `
    <div class="${result === "BIG" ? "big" : "small"}">
      ${result}
    </div>
    <div class="info">CONFIDENCE: ${percent}%</div>
    <div class="info">MD5: ${md5}</div>
  `;

  renderHistory();

  sendTelegram(result, percent, md5);

}

function renderHistory(){

  let box = document.getElementById("history");
  box.innerHTML = "";

  historyData.slice().reverse().forEach((v,i)=>{
    box.innerHTML += `
      <div class="item">#${historyData.length-i} → ${v}</div>
    `;
  });

}

async function sendTelegram(result, percent, md5){

  let text =
`MD5 MULTI BOT

MD5: ${md5}
RESULT: ${result}
CONFIDENCE: ${percent}%`;

  try{

    await fetch(
      `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          chat_id: "", 
          text:text
        })
      }
    );

  }catch(e){
    alert("Lỗi gửi Telegram");
  }

}

// auto load token khi mở web
window.onload = ()=>{
  BOT_TOKEN = localStorage.getItem("bot_token") || "";
};

</script>

</body>
</html>
