<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Dự Đoán</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    background:
    radial-gradient(circle at top,#1e3a8a,#020617 70%);

    min-height:100vh;

    overflow:hidden;

    color:white;

}

body::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:#3b82f6;

    filter:blur(180px);

    top:-150px;
    left:-100px;

    opacity:.3;

}

body::after{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:#ef4444;

    filter:blur(180px);

    bottom:-150px;
    right:-100px;

    opacity:.3;

}

.container{

    position:relative;

    z-index:10;

    width:95%;
    max-width:900px;

    margin:auto;

    padding-top:25px;

    text-align:center;

}

.title{

    font-size:40px;

    margin-bottom:25px;

    font-weight:bold;

    text-shadow:
    0 0 10px #fff,
    0 0 20px #3b82f6;

}

.glass{

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.2);

    backdrop-filter:blur(20px);

    border-radius:25px;

    padding:25px;

    box-shadow:
    0 0 20px rgba(59,130,246,.4);

}

.board{

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:wrap;

    margin-bottom:25px;

}

.card{

    width:130px;

    height:180px;

    border-radius:20px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.2);

    backdrop-filter:blur(15px);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:60px;

    font-weight:bold;

    color:white;

    box-shadow:
    0 0 20px rgba(255,255,255,.15);

}

.winner{

    border:2px solid #22c55e;

    box-shadow:
    0 0 15px #22c55e,
    0 0 40px #22c55e;

}

.lose{

    opacity:.5;

}

.buttons{

    margin-top:20px;

}

button{

    width:85px;

    height:85px;

    margin:8px;

    border:none;

    border-radius:18px;

    font-size:30px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    transition:.25s;

}

button:hover{

    transform:scale(1.08);

}

.red{

    background:#ef4444;

    box-shadow:
    0 0 15px #ef4444,
    0 0 35px #ef4444;

}

.blue{

    background:#3b82f6;

    box-shadow:
    0 0 15px #3b82f6,
    0 0 35px #3b82f6;

}

.green{

    background:#10b981;

    box-shadow:
    0 0 15px #10b981,
    0 0 35px #10b981;

}

.reset{

    background:#f59e0b;

    box-shadow:
    0 0 15px #f59e0b,
    0 0 35px #f59e0b;

}

.predict{

    margin-top:25px;

    font-size:34px;

    font-weight:bold;

    color:white;

    text-shadow:
    0 0 10px #fff,
    0 0 25px #38bdf8;

}

.history{

    margin-top:25px;

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:10px;

}

.dot{

    width:50px;
    height:50px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;

    font-size:20px;

}

.r{

    background:#ef4444;

    box-shadow:
    0 0 10px #ef4444;

}

.b{

    background:#3b82f6;

    box-shadow:
    0 0 10px #3b82f6;

}

.t{

    background:#10b981;

    box-shadow:
    0 0 10px #10b981;

}

.led{

    width:100%;

    height:4px;

    margin:25px 0;

    background:linear-gradient(
    90deg,
    #ef4444,
    #3b82f6,
    #10b981,
    #fff
    );

    box-shadow:
    0 0 10px #fff,
    0 0 20px #3b82f6;

    animation:led 3s linear infinite;

}

@keyframes led{

    100%{
        filter:hue-rotate(360deg);
    }

}

</style>
</head>
<body>

<div class="container">

<div class="title">
♠️ AI CARD PREDICT ♠️
</div>

<div class="glass">

<div class="board">

<div class="card" id="leftCard">?</div>

<div class="card" id="rightCard">?</div>

</div>

<div class="led"></div>

<div class="buttons">

<button class="red"
onclick="setCard('R')">
♥
</button>

<button class="blue"
onclick="setCard('B')">
♠
</button>

<button class="green"
onclick="setCard('T')">
=
</button>

<button class="reset"
onclick="resetGame()">
↺
</button>

</div>

<div class="predict" id="predict">
ĐỢI KẾT QUẢ...
</div>

<div class="history" id="history"></div>

</div>

</div>

<script>

let data=[];

function setCard(type){

    data.push(type);

    renderHistory();

    renderBoard(type);

    autoPredict();

}

function renderBoard(type){

    let left=document.getElementById("leftCard");

    let right=document.getElementById("rightCard");

    left.className="card";
    right.className="card";

    if(type==="R"){

        left.innerHTML="A";
        right.innerHTML="9";

        left.classList.add("winner");
        right.classList.add("lose");

    }

    if(type==="B"){

        left.innerHTML="5";
        right.innerHTML="K";

        right.classList.add("winner");
        left.classList.add("lose");

    }

    if(type==="T"){

        left.innerHTML="Q";
        right.innerHTML="Q";

        left.classList.add("winner");
        right.classList.add("winner");

    }

}

function autoPredict(){

    if(data.length<2){

        document.getElementById("predict")
        .innerHTML="AI ĐANG PHÂN TÍCH...";

        return;

    }

    let last=data[data.length-1];

    let text="";

    if(last==="R"){

        text="🔥 AI DỰ ĐOÁN: ♠";

    }

    if(last==="B"){

        text="🔥 AI DỰ ĐOÁN: ♥";

    }

    if(last==="T"){

        text="🔥 AI DỰ ĐOÁN: ♥";

    }

    let last3=data.slice(-3);

    if(last3.every(x=>x==="R")){

        text="💥 CẦU ĐỎ MẠNH";

    }

    if(last3.every(x=>x==="B")){

        text="💥 CẦU XANH MẠNH";

    }

    document.getElementById("predict")
    .innerHTML=text;

}

function renderHistory(){

    let history=document.getElementById("history");

    history.innerHTML="";

    data.slice(-20).forEach(item=>{

        let div=document.createElement("div");

        div.classList.add("dot");

        if(item==="R"){

            div.classList.add("r");

            div.innerHTML="♥";

        }

        if(item==="B"){

            div.classList.add("b");

            div.innerHTML="♠";

        }

        if(item==="T"){

            div.classList.add("t");

            div.innerHTML="=";

        }

        history.appendChild(div);

    });

}

function resetGame(){

    data=[];

    document.getElementById("history")
    .innerHTML="";

    document.getElementById("predict")
    .innerHTML="ĐỢI KẾT QUẢ...";

    document.getElementById("leftCard")
    .innerHTML="?";

    document.getElementById("rightCard")
    .innerHTML="?";

    document.getElementById("leftCard")
    .className="card";

    document.getElementById("rightCard")
    .className="card";

}

</script>

</body>
</html>
