<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Baccarat API Lobby</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f0f0f;
  color:white;
}

/* ===== LOBBY ===== */

#lobby{
  padding:12px;
}

.title{
  text-align:center;
  font-size:28px;
  color:#00ffaa;
  margin-bottom:18px;
  font-weight:bold;
}

.tables{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
}

.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:14px;
  padding:14px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  border-color:#00ffaa;
  transform:scale(1.02);
}

.name{
  font-size:22px;
  color:#00ffcc;
  font-weight:bold;
}

.status{
  margin-top:5px;
  color:#aaa;
  font-size:13px;
}

.preview-road{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:12px;
}

/* ===== ROOM ===== */

#room{
  display:none;
  padding:12px;
}

.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.back{
  border:none;
  background:#222;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

.room-title{
  font-size:24px;
  color:#00ffaa;
  font-weight:bold;
}

.predict-box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}

.predict-label{
  color:#aaa;
  margin-bottom:8px;
}

.predict-result{
  font-size:42px;
  font-weight:bold;
}

.road-grid{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.dot{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:bold;
}

.B{
  background:#0066ff;
}

.P{
  background:#ff0066;
}

.T{
  background:#00aa55;
}

.stats{
  margin-top:18px;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:14px;
  padding:14px;
  line-height:1.8;
}

</style>
</head>
<body>

<!-- ================= -->
<!-- LOBBY -->
<!-- ================= -->

<div id="lobby">

  <div class="title">
    Baccarat API Lobby
  </div>

  <div class="tables" id="tables"></div>

</div>

<!-- ================= -->
<!-- ROOM -->
<!-- ================= -->

<div id="room">

  <div class="topbar">

    <button class="back"
    onclick="backLobby()">
      ← Back
    </button>

    <div class="room-title"
    id="roomTitle">
      C01
    </div>

  </div>

  <div class="predict-box">

    <div class="predict-label">
      Dự đoán ván tiếp theo
    </div>

    <div class="predict-result"
    id="predictResult">
      B
    </div>

  </div>

  <div class="road-grid"
  id="roomRoad"></div>

  <div class="stats"
  id="stats"></div>

</div>

<script>

/*
========================
API
========================

Đổi link API tại đây
*/

const API =
"https://corsproxy.io/?https://employers-hormone-land-idaho.trycloudflare.com/api/bcr";

/*
========================
TABLES
========================
*/

const TABLES = [];

for(let i=1;i<=20;i++){

  TABLES.push(
    "c" + String(i).padStart(2,"0")
  );

}

/*
========================
DATA
========================
*/

const allData = {};

/*
========================
CREATE LOBBY
========================
*/

const tablesDiv =
document.getElementById("tables");

function renderLobby(){

  tablesDiv.innerHTML = "";

  TABLES.forEach(table=>{

    const results =
      allData[table] || [];

    const card =
      document.createElement("div");

    card.className = "card";

    card.onclick = ()=>
      openRoom(table);

    card.innerHTML = `

      <div class="name">
        ${table.toUpperCase()}
      </div>

      <div class="status">
        Online
      </div>

      <div class="preview-road">

        ${results.slice(-12).map(r=>`

          <div class="dot ${r}">
            ${r}
          </div>

        `).join("")}

      </div>

    `;

    tablesDiv.appendChild(card);

  });

}

/*
========================
OPEN ROOM
========================
*/

function openRoom(table){

  document
  .getElementById("lobby")
  .style.display = "none";

  document
  .getElementById("room")
  .style.display = "block";

  document
  .getElementById("roomTitle")
  .innerText =
    table.toUpperCase();

  const results =
    allData[table] || [];

  renderRoom(results);

}

/*
========================
BACK
========================
*/

function backLobby(){

  document
  .getElementById("room")
  .style.display = "none";

  document
  .getElementById("lobby")
  .style.display = "block";

}

/*
========================
PREDICT
========================
*/

function predict(results){

  if(results.length < 2)
    return "B";

  const last =
    results[results.length-1];

  const last2 =
    results[results.length-2];

  // bệt
  if(last === last2){

    return last;

  }

  // đảo cầu
  if(last === "B")
    return "P";

  if(last === "P")
    return "B";

  return "B";

}

/*
========================
RENDER ROOM
========================
*/

function renderRoom(results){

  const road =
    document.getElementById("roomRoad");

  road.innerHTML = "";

  results.forEach(r=>{

    road.innerHTML += `

      <div class="dot ${r}">
        ${r}
      </div>

    `;

  });

  const next =
    predict(results);

  const predictBox =
    document.getElementById("predictResult");

  predictBox.className =
    `predict-result ${next}`;

  predictBox.innerText =
    next;

  const b =
    results.filter(x=>x==="B").length;

  const p =
    results.filter(x=>x==="P").length;

  const t =
    results.filter(x=>x==="T").length;

  document
  .getElementById("stats")
  .innerHTML = `

    Banker: ${b}<br>
    Player: ${p}<br>
    Tie: ${t}<br>
    Tổng lịch sử: ${results.length}

  `;

}

/*
========================
LOAD API
========================

Ví dụ JSON API:

{
  "c01":["B","P","B","P"],
  "c02":["P","P","B"],
  "c03":["B","B","T"]
}

*/

async function loadAPI(){

  try{

    const res =
      await fetch(API);

    const json =
      await res.json();

    TABLES.forEach(table=>{

      allData[table] =
        json[table] || [];

    });

    renderLobby();

    // nếu đang mở phòng
    const current =
      document
      .getElementById("roomTitle")
      .innerText
      .toLowerCase();

    if(TABLES.includes(current)){

      renderRoom(
        allData[current]
      );

    }

  }catch(err){

    console.log(
      "API ERROR",
      err
    );

  }

}

loadAPI();

setInterval(loadAPI,1000);

</script>

</body>
</html>
