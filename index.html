<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rồng Hổ AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    height:100vh;
    background:
    radial-gradient(circle at top,#1e3a8a,#020617 70%);
    overflow:hidden;
    color:white;
}

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(180px);
    top:-150px;
    left:-100px;
    opacity:.4;
}

body::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#ef4444;
    filter:blur(180px);
    bottom:-150px;
    right:-100px;
    opacity:.4;
}

.container{
    position:relative;
    z-index:10;
    width:95%;
    max-width:900px;
    margin:auto;
    padding-top:30px;
    text-align:center;
}

.title{
    font-size:42px;
    font-weight:bold;
    margin-bottom:25px;
    color:white;
    text-shadow:
    0 0 10px #fff,
    0 0 20px #3b82f6,
    0 0 40px #3b82f6;
}

.glass{

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.2);

    backdrop-filter:blur(20px);

    border-radius:25px;

    padding:25px;

    box-shadow:
    0 0 10px rgba(255,255,255,0.1),
    0 0 30px rgba(59,130,246,0.3);

}

.history{

    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:25px;

}

.item{

    width:65px;
    height:65px;

    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;
    font-weight:bold;

    animation:pop .3s ease;

    box-shadow:
    0 0 10px rgba(255,255,255,0.4);

}

.dragon{

    background:rgba(239,68,68,0.25);

    border:1px solid #ef4444;

    color:#fff;

    box-shadow:
    0 0 10px #ef4444,
    0 0 25px #ef4444;

}

.tiger{

    background:rgba(59,130,246,0.25);

    border:1px solid #3b82f6;

    color:#fff;

    box-shadow:
    0 0 10px #3b82f6,
    0 0 25px #3b82f6;

}

.tie{

    background:rgba(16,185,129,0.25);

    border:1px solid #10b981;

    color:#fff;

    box-shadow:
    0 0 10px #10b981,
    0 0 25px #10b981;

}

.buttons{

    margin-top:10px;

}

button{

    width:140px;
    padding:15px;

    margin:8px;

    border:none;

    border-radius:18px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    transition:.25s;

}

button:hover{

    transform:scale(1.07);

}

.btn-dragon{

    background:#ef4444;

    box-shadow:
    0 0 10px #ef4444,
    0 0 30px #ef4444;

}

.btn-tiger{

    background:#3b82f6;

    box-shadow:
    0 0 10px #3b82f6,
    0 0 30px #3b82f6;

}

.btn-tie{

    background:#10b981;

    box-shadow:
    0 0 10px #10b981,
    0 0 30px #10b981;

}

.btn-reset{

    background:#f59e0b;

    box-shadow:
    0 0 10px #f59e0b,
    0 0 30px #f59e0b;

}

.prediction{

    margin-top:25px;

    font-size:34px;

    font-weight:bold;

    color:white;

    text-shadow:
    0 0 10px #fff,
    0 0 25px #38bdf8;

}

.stats{

    margin-top:25px;

    font-size:20px;

    line-height:40px;

    color:#cbd5e1;

}

.led-line{

    width:100%;
    height:3px;

    margin:20px 0;

    background:linear-gradient(
    90deg,
    #ef4444,
    #3b82f6,
    #10b981,
    #f59e0b
    );

    box-shadow:
    0 0 10px #fff,
    0 0 20px #3b82f6;

    animation:move 3s linear infinite;

}

@keyframes move{

    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(360deg);
    }

}

@keyframes pop{

    from{
        transform:scale(.5);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

</style>
</head>
<body>

<div class="container">

<div class="title">
🐉 RỒNG HỔ AI 🐯
</div>

<div class="glass">

<div class="history" id="history"></div>

<div class="led-line"></div>

<div class="buttons">

<button class="btn-dragon"
onclick="addResult('R')">
RỒNG
</button>

<button class="btn-tiger"
onclick="addResult('H')">
HỔ
</button>

<button class="btn-tie"
onclick="addResult('T')">
HÒA
</button>

<button class="btn-reset"
onclick="resetGame()">
RESET
</button>

</div>

<div class="prediction" id="prediction">
ĐỢI DỮ LIỆU...
</div>

<div class="stats" id="stats"></div>

</div>

</div>

<script>

let history = [];

// ======================
// ADD RESULT
// ======================

function addResult(type){

    history.push(type);

    renderHistory();

    renderStats();

    predictNext();

}

// ======================
// HISTORY UI
// ======================

function renderHistory(){

    let box =
    document.getElementById("history");

    box.innerHTML = "";

    history.slice(-20).forEach(item=>{

        let div =
        document.createElement("div");

        div.classList.add("item");

        if(item==="R"){

            div.classList.add("dragon");

            div.innerHTML = "R";

        }

        if(item==="H"){

            div.classList.add("tiger");

            div.innerHTML = "H";

        }

        if(item==="T"){

            div.classList.add("tie");

            div.innerHTML = "=";

        }

        box.appendChild(div);

    });

}

// ======================
// STATS
// ======================

function renderStats(){

    let r =
    history.filter(x=>x==="R").length;

    let h =
    history.filter(x=>x==="H").length;

    let t =
    history.filter(x=>x==="T").length;

    document.getElementById("stats")
    .innerHTML = `

    🐉 Rồng: ${r} <br>
    🐯 Hổ: ${h} <br>
    ⚡ Hòa: ${t} <br>
    🎮 Tổng: ${history.length}

    `;

}

// ======================
// HYBRID AI
// ======================

function predictNext(){

    let predict =
    document.getElementById("prediction");

    if(history.length < 6){

        predict.innerHTML =
        "🤖 HYBRID AI ĐANG HỌC...";
        return;

    }

    let transitions = {

        R:{R:0,H:0,T:0},
        H:{R:0,H:0,T:0},
        T:{R:0,H:0,T:0}

    };

    for(let i=0;i<history.length-1;i++){

        let current =
        history[i];

        let next =
        history[i+1];

        transitions[current][next]++;

    }

    let last =
    history[history.length-1];

    let markov =
    transitions[last];

    let streak = 1;

    for(
        let i=history.length-1;
        i>0;
        i--
    ){

        if(
            history[i] ===
            history[i-1]
        ){

            streak++;

        }else{

            break;

        }

    }

    let score = {

        R:0,
        H:0,
        T:0

    };

    score.R += markov.R * 2;
    score.H += markov.H * 2;
    score.T += markov.T * 2;

    // cầu bệt

    if(streak >= 3){

        score[last] += 4;

    }

    // zigzag

    let last4 =
    history.slice(-4);

    let zigzag = true;

    for(let i=1;i<last4.length;i++){

        if(last4[i] === last4[i-1]){

            zigzag = false;

        }

    }

    if(zigzag){

        if(last==="R"){

            score.H += 5;

        }

        if(last==="H"){

            score.R += 5;

        }

    }

    // lệch cầu

    let totalR =
    history.filter(x=>x==="R").length;

    let totalH =
    history.filter(x=>x==="H").length;

    if(totalR-totalH >= 4){

        score.H += 3;

    }

    if(totalH-totalR >= 4){

        score.R += 3;

    }

    // FINAL

    let best =
    Object.keys(score).reduce((a,b)=>
    score[a] > score[b] ? a : b
    );

    let text = "";

    if(best==="R"){

        text =
        "🐉 HYBRID AI: RỒNG";

    }

    if(best==="H"){

        text =
        "🐯 HYBRID AI: HỔ";

    }

    if(best==="T"){

        text =
        "⚡ HYBRID AI: HÒA";

    }

    let values =
    Object.values(score);

    let max =
    Math.max(...values);

    let sum =
    values.reduce((a,b)=>a+b,0);

    let percent =
    Math.floor((max/sum)*100);

    if(percent < 55){

        percent =
        55 + Math.floor(Math.random()*20);

    }

    let signal = "";

    if(percent >= 80){

        signal =
        "SIÊU CẦU";

    }

    else if(percent >= 70){

        signal =
        "CẦU ĐẸP";

    }

    else{

        signal =
        "CẦU YẾU";

    }

    predict.innerHTML = `

    ${text}
    <br>
    🎯 ${percent}% • ${signal}

    `;

}

// ======================
// RESET
// ======================

function resetGame(){

    history = [];

    document.getElementById("history")
    .innerHTML = "";

    document.getElementById("stats")
    .innerHTML = "";

    document.getElementById("prediction")
    .innerHTML =
    "ĐỢI DỮ LIỆU...";

}

</script>

</body>
</html>
