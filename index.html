<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiLo Deck AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:15px;
}

.box{
  max-width:520px;
  margin:auto;
  background:#111827;
  padding:15px;
  border-radius:12px;
}

h2{text-align:center;}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:none;
  margin-top:10px;
}

.row{display:flex; gap:10px; margin-top:10px;}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.add{background:#3b82f6;color:white;}
.clear{background:#ef4444;color:white;width:100%;margin-top:10px;}

#history{
  margin-top:12px;
  background:#0b1220;
  padding:10px;
  border-radius:8px;
  font-size:14px;
}

#ai{
  margin-top:12px;
  background:#1f2937;
  padding:10px;
  border-radius:8px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">
  <h2>🃏 HiLo A→K AI</h2>

  <input id="cardInput" placeholder="Nhập: A,2,3...10,J,Q,K">

  <div class="row">
    <button class="add" onclick="addCard()">ADD</button>
  </div>

  <button class="clear" onclick="clearAll()">CLEAR</button>

  <div id="ai">AI: nhập dữ liệu</div>
  <div id="history"></div>
</div>

<script>

let data = [];

// =========================
// MAP CARD → HIGH/LOW
// =========================
function toHL(card){

  card = card.toUpperCase().trim();

  if(["A","2","3","4","5","6","7"].includes(card)){
    return "L";
  }

  if(["8","9","10","J","Q","K"].includes(card)){
    return "H";
  }

  return null;
}

// =========================
function addCard(){

  let val = document.getElementById("cardInput").value;

  let hl = toHL(val);

  if(!hl){
    alert("Sai input!");
    return;
  }

  data.push(hl);
  document.getElementById("cardInput").value = "";

  render();
}

function clearAll(){
  data = [];
  render();
}

function render(){
  document.getElementById("history").innerText =
    "History: " + data.join(" ");

  analyze();
}

// =========================
// AI ENGINE
// =========================
function analyze(){

  if(data.length < 5){
    document.getElementById("ai").innerText =
      "AI: cần ít nhất 5 lá";
    return;
  }

  let seq = data;

  let last = seq[seq.length - 1];

  // =====================
  // STREAK
  // =====================
  let streak = 1;
  for(let i=seq.length-2;i>=0;i--){
    if(seq[i] === last) streak++;
    else break;
  }

  // =====================
  // PATTERN CHECK
  // =====================
  let last5 = seq.slice(-5).join("");

  let is11 = (last5 === "HLHLH" || last5 === "LHLHL");
  let is12 = (last5.includes("HLL") || last5.includes("LLH"));

  // =====================
  // SẮP ĐẢO
  // =====================
  let soonReverse = false;

  if(streak >= 3) soonReverse = true;
  if(is11 && seq.slice(-2).join("") !== "HL" && seq.slice(-2).join("") !== "LH"){
    soonReverse = true;
  }

  // =====================
  // CẦU GÃY
  // =====================
  let broken = false;

  let flip = 0;
  for(let i=1;i<seq.length;i++){
    if(seq[i] !== seq[i-1]) flip++;
  }

  let flipRate = flip / seq.length;

  if(flipRate > 0.7){
    broken = true;
  }

  if(is12 && streak === 1){
    broken = true;
  }

  // =====================
  // OUTPUT
  // =====================
  let msg = "";

  msg += "🃏 Last: " + last + "<br>";
  msg += "📊 Streak: " + last + " x" + streak + "<br>";

  if(is11){
    msg += "🔁 Cầu 1-1<br>";
  }
  else if(is12){
    msg += "📈 Cầu 1-2<br>";
  }
  else{
    msg += "❓ Cầu yếu<br>";
  }

  if(soonReverse){
    msg += "⚠️ SẮP ĐẢO CẦU<br>";
  }

  if(broken){
    msg += "💥 CẦU GÃY / NHIỄU<br>";
  }

  if(!soonReverse && !broken){
    msg += "🧠 Cầu ổn định<br>";
  }

  document.getElementById("ai").innerHTML = msg;
}

</script>

</body>
</html>
