<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HILO AI TOOL</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  overflow:hidden;
}

#floating{
  position:fixed;
  top:50px;
  left:10px;
  width:360px;
  background:#111827;
  border:2px solid #2563eb;
  border-radius:18px;
  z-index:999999;
  box-shadow:0 0 25px rgba(0,0,0,.5);
}

#topbar{
  padding:12px;
  background:#1e3a8a;
  border-radius:16px 16px 0 0;
  font-weight:bold;
  text-align:center;
  cursor:move;
}

#content{
  padding:12px;
}

.row{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

button{
  flex:1;
  border:none;
  border-radius:10px;
  padding:12px;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.high{
  background:#ca8a04;
}

.low{
  background:#db2777;
}

.reset{
  background:#dc2626;
}

.ai{
  background:#2563eb;
}

.card{
  background:#1f2937;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

#history{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  max-height:120px;
  overflow:auto;
}

.ball{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

.H{
  background:#eab308;
  color:black;
}

.L{
  background:#ec4899;
}

.S{
  background:#6b7280;
}

#predict{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin-top:10px;
}

.safe{
  color:#22c55e;
}

.risk{
  color:#f59e0b;
}

.danger{
  color:#ef4444;
}

.small{
  font-size:13px;
  opacity:.8;
  margin-top:4px;
}

</style>
</head>
<body>

<div id="floating">

<div id="topbar">
HILO AI OVERLAY
</div>

<div id="content">

<div class="card">
<div>Bài hiện tại:</div>
<select id="card" style="width:100%;padding:10px;margin-top:8px;border-radius:10px;font-size:18px;">
<option value="1">A</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
<option value="11">J</option>
<option value="12">Q</option>
<option value="13">K</option>
<option value="14">A</option>
</select>
</div>

<div class="row">
<button class="high" onclick="addResult('H')">HIGH</button>
<button class="low" onclick="addResult('L')">LOW</button>
<button class="ai" onclick="addResult('S')">SKIP</button>
</div>

<div class="row">
<button class="ai" onclick="analyze()">AI ANALYZE</button>
<button class="reset" onclick="resetAll()">RESET</button>
</div>

<div class="card">
<div id="predict">WAIT...</div>
<div class="small" id="stats"></div>
</div>

<div class="card">
<div style="margin-bottom:10px;">LỊCH SỬ</div>
<div id="history"></div>
</div>

</div>
</div>

<script>

let historyData = JSON.parse(localStorage.getItem("hilo_history") || "[]");

function render(){

  const history = document.getElementById("history");
  history.innerHTML = "";

  historyData.slice(-40).forEach(x=>{

    let div = document.createElement("div");
    div.className = "ball " + x;
    div.innerText =
      x === 'H'
      ? 'H'
      : x === 'L'
      ? 'L'
      : 'S';
    history.appendChild(div);

  });

  localStorage.setItem(
    "hilo_history",
    JSON.stringify(historyData)
  );

}

function addResult(type){

  historyData.push(type);
  render();
  analyze();

}

function resetAll(){

  historyData = [];
  render();
  analyze();

}

function streak(){

  if(historyData.length === 0) return 0;

  let last = historyData[historyData.length-1];
  let s = 0;

  for(let i=historyData.length-1;i>=0;i--){

    if(historyData[i] === last){
      s++;
    }else{
      break;
    }

  }

  return s;

}

function analyze(){

  let card = parseInt(
    document.getElementById("card").value
  );

  let predict = "SKIP";
  let level = "DANGER";

  // A nhỏ nhất
  if(card <= 4){

    predict = "HIGH";
    level = "SAFE";

  }

  // J Q K
  else if(card >= 11){

    predict = "LOW";
    level = "SAFE";

  }

  // 9 10
  else if(card == 9 || card == 10){

    predict = "LOW";
    level = "RISK";

  }

  // 5 6 7 8
  else {

    predict = "SKIP";
    level = "DANGER";

  }

  // cầu bệt
  let last5 = historyData.slice(-5);

  if(last5.length === 5){

    let allH = last5.every(x=>x==='H');
    let allL = last5.every(x=>x==='L');

    if(allH){
      predict = "LOW";
      level = "SAFE";
    }

    if(allL){
      predict = "HIGH";
      level = "SAFE";
    }

  }

  let cls = "safe";

  if(level === "RISK") cls = "risk";
  if(level === "DANGER") cls = "danger";

  document.getElementById("predict")
  .innerHTML = `
    <div class="${cls}">${predict}</div>
    <div style="font-size:15px;margin-top:5px;">${level}</div>
  `;

  document.getElementById("stats")
  .innerHTML = `
    A/2/3/4 = HIGH |
    J/Q/K = LOW |
    5/6/7/8 = SKIP
  `;

}

render();
analyze();

// DRAG MOBILE

const floating = document.getElementById("floating");
const topbar = document.getElementById("topbar");

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

topbar.addEventListener("touchstart", e=>{

  isDragging = true;

  offsetX = e.touches[0].clientX - floating.offsetLeft;
  offsetY = e.touches[0].clientY - floating.offsetTop;

});

window.addEventListener("touchmove", e=>{

  if(!isDragging) return;

  floating.style.left =
    (e.touches[0].clientX-offsetX)+"px";

  floating.style.top =
    (e.touches[0].clientY-offsetY)+"px";

});

window.addEventListener("touchend", ()=>{
  isDragging = false;
});

</script>

</body>
</html>
